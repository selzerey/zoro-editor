name: Release

# Push a tag like v1.1.0 to publish that version to npm.
# Uses npm trusted publishing (OIDC): no npm token is stored in the repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, exif, fileinfo, mbstring, dom
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:php
      - run: npm publish --access public --provenance
