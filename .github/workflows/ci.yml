name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, exif, fileinfo, mbstring, dom
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:php
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          php -S 127.0.0.1:8765 -t . > /tmp/php.log 2>&1 &
          sleep 1
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/shots
